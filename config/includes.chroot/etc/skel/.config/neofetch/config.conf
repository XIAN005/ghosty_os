# Config neofetch de GhostyOS

print_info() {
    info title
    info underline

    prin "OS" "GhostyOS"
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory

    prin
    prin "Communauté" "GhostyOS"
    info cols
}

# Titre et séparateur
title_fg="6"
underline_enabled="on"
underline_char="-"

# Formats
kernel_shorthand="on"
distro_shorthand="off"
os_arch="off"
uptime_shorthand="on"
memory_percent="on"
package_managers="on"
shell_path="off"
shell_version="off"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="off"
cpu_cores="off"
gpu_brand="on"
refresh_rate="off"

# Couleurs du texte
colors=(6 7 6 6 7 7)
bold="on"

# Barre de couleurs
color_blocks="on"
block_width=3
block_height=1
block_range=(0 7)

# Logo ASCII
image_backend="ascii"
image_source="/usr/share/ghosty_os/Ghostyascii.txt"
ascii_colors=(4 6 7 1 2 3)
ascii_bold="on"
gap=3
stdout="off"
